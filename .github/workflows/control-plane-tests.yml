name: Control plane offline source checks

on:
  pull_request:
  push:
    branches:
      - 'atomic/**'
      - 'subsection/**'
      - 'section/**'
      - development
      - testing
      - staging
      - production
      - main

permissions:
  contents: read

concurrency:
  group: control-plane-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-source-validation:
    name: control-plane-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-pinned SQL test driver
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes \
            --target "${RUNNER_TEMP}/codestra-test-deps" -r requirements-ci.txt
      - name: Require mandatory PostgreSQL 16 test runtime
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          /usr/lib/postgresql/16/bin/initdb --version
          /usr/lib/postgresql/16/bin/pg_ctl --version
      - name: Run no-effect offline regression suite
        env:
          PRODUCTION_GO: 'NO'
          LIVE_CAPABILITIES_ENABLED: 'NO'
          EXTERNAL_EFFECTS: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: '${{ runner.temp }}/codestra-test-deps'
        run: python3 -m unittest discover -s tests -v
