name: Prepublication no-effect source checks

on:
  pull_request:
    branches:
      - 'subsection/cp-01-foundation--02-trusted-decisions'
  push:
    branches:
      - 'atomic/cp-01-foundation--02-prepublication-admission-456'

permissions:
  contents: read

concurrency:
  group: codestra-control-plane-offline-tests
  cancel-in-progress: false

jobs:
  offline-source-validation:
    name: prepublication-offline-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install hash-pinned SQL test driver
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes \
            --target "${RUNNER_TEMP}/codestra-test-deps" -r requirements-ci.txt
      - name: Require mandatory PostgreSQL 16 test runtime
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          /usr/lib/postgresql/16/bin/initdb --version
          /usr/lib/postgresql/16/bin/pg_ctl --version
      - name: Run complete no-effect source suite
        env:
          PRODUCTION_GO: 'NO'
          LIVE_CAPABILITIES_ENABLED: 'NO'
          EXTERNAL_EFFECTS: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: '${{ runner.temp }}/codestra-test-deps'
        run: python3 -S -m unittest discover -s tests -v
